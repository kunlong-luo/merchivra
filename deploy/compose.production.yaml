# Overlay for an HTTPS-terminated, independently reviewed deployment.
# Does not configure TLS or ingress itself. Never enable Demo + production Seller.
# docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.production.yaml up -d --build
services:
  server:
    environment:
      MERCHIVRA_DEMO_ENABLED: 'false'
      MERCHIVRA_SESSION_COOKIE_SECURE: 'true'
      MERCHIVRA_SPAPI_ENABLED: ${MERCHIVRA_SPAPI_ENABLED:-false}
      MERCHIVRA_SPAPI_SANDBOX: ${MERCHIVRA_SPAPI_SANDBOX:-true}
      MERCHIVRA_SPAPI_ALLOW_WRITES: 'false'
      MERCHIVRA_SPAPI_PRIVATE_ENABLED: ${MERCHIVRA_SPAPI_PRIVATE_ENABLED:-false}
      MERCHIVRA_SPAPI_VERIFICATION_ENABLED: ${MERCHIVRA_SPAPI_VERIFICATION_ENABLED:-false}
      MERCHIVRA_SPAPI_ORDERS_ROLE_REVIEW_ENABLED: ${MERCHIVRA_SPAPI_ORDERS_ROLE_REVIEW_ENABLED:-false}
      MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEY_BASE64: ${MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEY_BASE64:-}
      MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEYRING: ${MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEYRING:-}
      MERCHIVRA_SPAPI_OAUTH_ACTIVE_KEY_VERSION: ${MERCHIVRA_SPAPI_OAUTH_ACTIVE_KEY_VERSION:-1}
      MERCHIVRA_SPAPI_OAUTH_SECURE_COOKIE: 'true'
      MERCHIVRA_ORDERS_SYNC_ENABLED: ${MERCHIVRA_ORDERS_SYNC_ENABLED:-false}
      MERCHIVRA_ORDERS_SYNC_MODE: ${MERCHIVRA_ORDERS_SYNC_MODE:-MOCK}
      MERCHIVRA_ORDERS_SYNC_LIVE_APPROVED: ${MERCHIVRA_ORDERS_SYNC_LIVE_APPROVED:-false}
