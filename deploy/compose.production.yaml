# Overlay for an HTTPS-terminated, independently reviewed deployment.
# Does not configure TLS or ingress itself. Never enable Demo + production Seller.
# docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.production.yaml up -d --build
services:
  server:
    environment:
      DEMO_ENABLED: 'false'
      # V137: required private original scan before any DB BYTEA insert.
      # Ops must supply an internal-only clamd hostname/network, not public TCP.
      # Blank host intentionally makes Spring startup fail closed.
      EVIDENCE_AV_REQUIRED: 'true'
      EVIDENCE_AV_HOST: ${EVIDENCE_AV_HOST:-}
      EVIDENCE_AV_PORT: ${MERCHIVRA_EVIDENCE_AV_PORT:-3310}
      SESSION_COOKIE_SECURE: 'true'
      SPAPI_ENABLED: ${MERCHIVRA_SPAPI_ENABLED:-false}
      SPAPI_SANDBOX: ${MERCHIVRA_SPAPI_SANDBOX:-true}
      SPAPI_ALLOW_WRITES: 'false'
      SPAPI_PRIVATE_ENABLED: ${MERCHIVRA_SPAPI_PRIVATE_ENABLED:-false}
      SPAPI_VERIFICATION_ENABLED: ${MERCHIVRA_SPAPI_VERIFICATION_ENABLED:-false}
      SPAPI_ORDERS_ROLE_REVIEW_ENABLED: ${MERCHIVRA_SPAPI_ORDERS_ROLE_REVIEW_ENABLED:-false}
      SPAPI_OAUTH_ENCRYPTION_KEY_BASE64: ${MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEY_BASE64:-}
      SPAPI_OAUTH_ENCRYPTION_KEYRING: ${MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEYRING:-}
      SPAPI_OAUTH_ACTIVE_KEY_VERSION: ${MERCHIVRA_SPAPI_OAUTH_ACTIVE_KEY_VERSION:-1}
      SPAPI_OAUTH_SECURE_COOKIE: 'true'
      ORDERS_SYNC_ENABLED: ${MERCHIVRA_ORDERS_SYNC_ENABLED:-false}
      ORDERS_SYNC_MODE: ${MERCHIVRA_ORDERS_SYNC_MODE:-MOCK}
      ORDERS_SYNC_LIVE_APPROVED: ${MERCHIVRA_ORDERS_SYNC_LIVE_APPROVED:-false}
