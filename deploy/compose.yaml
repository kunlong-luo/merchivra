services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: merchivra
      POSTGRES_USER: merchivra
      POSTGRES_PASSWORD: ${MERCHIVRA_DB_PASSWORD:?Set MERCHIVRA_DB_PASSWORD in .env}
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchivra -d merchivra"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    # Not used by current Spring Boot code. Opt-in only, to keep the default
    # local stack to three services: postgres + server + web.
    profiles: ['optional-cache']
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    # Local-only separate Redis has no AUTH, no published host port.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data
    restart: unless-stopped

  server:
    build:
      context: ../apps/server
      args:
        # Blank in dev/CI; a trusted release builder must set a reviewed main SHA.
        MERCHIVRA_BUILD_REVISION: ${MERCHIVRA_BUILD_REVISION:-}
    environment:
      SERVER_ADDRESS: 0.0.0.0 # Container-only bind; published port remains loopback.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: merchivra
      DB_USER: merchivra
      DB_PASSWORD: ${MERCHIVRA_DB_PASSWORD:?Set MERCHIVRA_DB_PASSWORD in .env}
      TEAM_ENABLED: ${MERCHIVRA_TEAM_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_DATABASE: ${MERCHIVRA_REDIS_DATABASE:-0}
      # Bundled optional Redis is a private dev-only container without AUTH.
      REDIS_PASSWORD: ''
      REDIS_SESSIONS_ENABLED: ${MERCHIVRA_REDIS_SESSIONS_ENABLED:-false}
      REDIS_HEALTH_ENABLED: ${MERCHIVRA_REDIS_HEALTH_ENABLED:-false}
      SPAPI_RATE_LIMIT_ENABLED: ${MERCHIVRA_SPAPI_RATE_LIMIT_ENABLED:-false}
      SPAPI_RATE_LIMIT_COOLDOWN_MS: ${MERCHIVRA_SPAPI_RATE_LIMIT_COOLDOWN_MS:-2000}
      DEMO_ENABLED: 'true' # Only invented fixtures; real OAuth fails closed in Demo mode.
      # Explicit synthetic-only bypass, never use as a production upload source.
      EVIDENCE_AV_REQUIRED: 'false'
      ORDERS_SYNC_ENABLED: ${MERCHIVRA_ORDERS_SYNC_ENABLED:-false}
      ORDERS_SYNC_MODE: ${MERCHIVRA_ORDERS_SYNC_MODE:-MOCK}
      ORDERS_SYNC_LIVE_APPROVED: ${MERCHIVRA_ORDERS_SYNC_LIVE_APPROVED:-false}
      ORDERS_SYNC_SCHEDULER_ENABLED: ${MERCHIVRA_ORDERS_SYNC_SCHEDULER_ENABLED:-false}
      ORDERS_SYNC_SCHEDULER_MS: ${MERCHIVRA_ORDERS_SYNC_SCHEDULER_MS:-30000}
      SPAPI_ENABLED: ${MERCHIVRA_SPAPI_ENABLED:-false}
      SPAPI_SANDBOX: ${MERCHIVRA_SPAPI_SANDBOX:-true}
      SPAPI_ALLOW_WRITES: ${MERCHIVRA_SPAPI_ALLOW_WRITES:-false}
      SPAPI_OAUTH_ENABLED: ${MERCHIVRA_SPAPI_OAUTH_ENABLED:-false}
      SPAPI_APP_ID: ${MERCHIVRA_SPAPI_APP_ID:-}
      SPAPI_OAUTH_REDIRECT_URI: ${MERCHIVRA_SPAPI_OAUTH_REDIRECT_URI:-}
      SPAPI_OAUTH_AMAZON_ORIGINS: ${MERCHIVRA_SPAPI_OAUTH_AMAZON_ORIGINS:-}
      SPAPI_OAUTH_ENCRYPTION_KEY_BASE64: ${MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEY_BASE64:-}
      LWA_CLIENT_ID: ${MERCHIVRA_LWA_CLIENT_ID:-}
      LWA_CLIENT_SECRET: ${MERCHIVRA_LWA_CLIENT_SECRET:-}
      BOOTSTRAP_USERNAME: ${MERCHIVRA_BOOTSTRAP_USERNAME:-}
      BOOTSTRAP_PASSWORD: ${MERCHIVRA_BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_TENANT_NAME: ${MERCHIVRA_BOOTSTRAP_TENANT_NAME:-Merchivra Workspace}
      SESSION_COOKIE_SECURE: 'false' # Local HTTP only; HTTPS deployment MUST set true.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Default local ERP is private Next.js 16 standalone.
    build:
      context: ../apps/web
      dockerfile: Dockerfile.next
      args:
        MERCHIVRA_API_INTERNAL_URL: http://server:8080
        MERCHIVRA_BUILD_REVISION: ${MERCHIVRA_BUILD_REVISION:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const options = {signal: AbortSignal.timeout(3000),
          redirect: 'manual', cache: 'no-store'};
          fetch('http://127.0.0.1:3000/api/v1/ping', options)
          .then(async response => {
          if (response.status !== 200
          || !response.headers.get('content-type')?.toLowerCase().includes('application/json'))
          return false;
          const ping = await response.json();
          if (!ping || ping.service !== 'merchivra'
          || ping.status !== 'ok' || ping.stage !== 'M0') return false;
          const health = await fetch('http://server:8080/actuator/health', options);
          const media = health.headers.get('content-type')?.toLowerCase().split(';', 1)[0].trim();
          if (health.status !== 200
          || !(media === 'application/json'
          || media === 'application/vnd.spring-boot.actuator.v3+json'
          || media === 'application/vnd.spring-boot.actuator.v2+json'))
          return false;
          const state = await health.json();
          return state && state.status === 'UP';
          })
          .then(ok => process.exit(ok ? 0 : 1))
          .catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s


volumes:
  pgdata18:
  redisdata:
