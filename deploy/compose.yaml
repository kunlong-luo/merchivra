services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merchivra
      POSTGRES_USER: merchivra
      POSTGRES_PASSWORD: ${MERCHIVRA_DB_PASSWORD:?Set MERCHIVRA_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchivra -d merchivra"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  server:
    build:
      context: ../apps/server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: merchivra
      DB_USER: merchivra
      DB_PASSWORD: ${MERCHIVRA_DB_PASSWORD:?Set MERCHIVRA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
