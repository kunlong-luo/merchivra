services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merchivra
      POSTGRES_USER: merchivra
      POSTGRES_PASSWORD: ${MERCHIVRA_DB_PASSWORD:?Set MERCHIVRA_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchivra -d merchivra"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  server:
    build:
      context: ../apps/server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: merchivra
      DB_USER: merchivra
      DB_PASSWORD: ${MERCHIVRA_DB_PASSWORD:?Set MERCHIVRA_DB_PASSWORD in .env}
      MERCHIVRA_DEMO_ENABLED: 'true' # Only invented fixtures; real OAuth fails closed in Demo mode.
      MERCHIVRA_SPAPI_ENABLED: ${MERCHIVRA_SPAPI_ENABLED:-false}
      MERCHIVRA_SPAPI_SANDBOX: ${MERCHIVRA_SPAPI_SANDBOX:-true}
      MERCHIVRA_SPAPI_ALLOW_WRITES: ${MERCHIVRA_SPAPI_ALLOW_WRITES:-false}
      MERCHIVRA_SPAPI_OAUTH_ENABLED: ${MERCHIVRA_SPAPI_OAUTH_ENABLED:-false}
      MERCHIVRA_SPAPI_APP_ID: ${MERCHIVRA_SPAPI_APP_ID:-}
      MERCHIVRA_SPAPI_OAUTH_REDIRECT_URI: ${MERCHIVRA_SPAPI_OAUTH_REDIRECT_URI:-}
      MERCHIVRA_SPAPI_OAUTH_AMAZON_ORIGINS: ${MERCHIVRA_SPAPI_OAUTH_AMAZON_ORIGINS:-}
      MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEY_BASE64: ${MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEY_BASE64:-}
      MERCHIVRA_LWA_CLIENT_ID: ${MERCHIVRA_LWA_CLIENT_ID:-}
      MERCHIVRA_LWA_CLIENT_SECRET: ${MERCHIVRA_LWA_CLIENT_SECRET:-}
      MERCHIVRA_BOOTSTRAP_USERNAME: ${MERCHIVRA_BOOTSTRAP_USERNAME:-}
      MERCHIVRA_BOOTSTRAP_PASSWORD: ${MERCHIVRA_BOOTSTRAP_PASSWORD:-}
      MERCHIVRA_BOOTSTRAP_TENANT_NAME: ${MERCHIVRA_BOOTSTRAP_TENANT_NAME:-Merchivra Workspace}
      MERCHIVRA_SESSION_COOKIE_SECURE: 'false' # Local HTTP only; HTTPS deployment MUST set true.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
