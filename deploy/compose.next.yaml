# V122: opt-in private Next.js Node App Router for disposable acceptance
# and controlled cutover. Vite/Nginx web stays unchanged as rollback.
# Only use behind reviewed HTTPS ingress; loopback staging port is NOT public.
#
# docker compose --env-file .env -f deploy/compose.yaml \
#   -f deploy/compose.next.yaml up -d --build next-web
services:
  next-web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.next
      args:
        MERCHIVRA_API_INTERNAL_URL: http://server:8080
    ports:
      - "127.0.0.1:${MERCHIVRA_NEXT_PORT:-3001}:3000"
    depends_on:
      - server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NEXT_TELEMETRY_DISABLED: '1'
    # V153: a bare HTTP 200 is insufficient (a default Nginx/HTML success
    # page or wrong service could otherwise mark Next as healthy).
    # Verify Spring's exact bounded same-origin PingController identity.
    # Node 24 fetch only; never send credentials or call external targets.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/v1/ping',
          {signal: AbortSignal.timeout(3000), redirect: 'manual', cache: 'no-store'})
          .then(async response => {
          if (response.status !== 200
          || !response.headers.get('content-type')?.toLowerCase().includes('application/json'))
          return false;
          const ping = await response.json();
          return ping && ping.service === 'merchivra'
          && ping.status === 'ok' && ping.stage === 'M0';
          })
          .then(ok => process.exit(ok ? 0 : 1))
          .catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    # No Seller, Ads, bank or database secrets are injected into this service.
