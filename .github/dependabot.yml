version: 2
# Routine version-update PRs disabled: user requested direct-to-main development.
# Dependabot vulnerability alerts / security update configuration is controlled separately in repository settings.
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gradle
    directory: /apps/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
