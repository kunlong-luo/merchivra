# Regression focus: same internal SKU across US and DE sites must reuse tenant SKU ID.
name: Mock full-chain Compose validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mock-full-chain.yml
jobs:
  mock-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Configure disposable local-only test credentials
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          Path(".env").write_text(
              "MERCHIVRA_DB_PASSWORD=" + secrets.token_urlsafe(24) + "\n"
              + "MERCHIVRA_BOOTSTRAP_USERNAME=local-smoke-admin\n"
              + "MERCHIVRA_BOOTSTRAP_PASSWORD=" + secrets.token_urlsafe(32) + "\n"
          )
          PY
      - name: Build and run Nginx, Spring Boot and PostgreSQL
        run: |
          docker compose --env-file .env -f deploy/compose.yaml up --build -d postgres server web
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/v1/ping >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
      - name: Verify Mock operations through real HTTP and PostgreSQL
        run: |
          set -a
          . ./.env
          set +a
          python3 scripts/smoke_mock_chain.py --stage initial
      - name: Restart backend and verify persisted chain and logout
        run: |
          docker compose --env-file .env -f deploy/compose.yaml restart server
          ready=0
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:3000/api/v1/ping >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          set -a
          . ./.env
          set +a
          python3 scripts/smoke_mock_chain.py --stage restart
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml logs --no-color --tail=150
      - name: Dispose of local data
        if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down --volumes --remove-orphans
