name: One-time cleanup of 7 superseded branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-direct-main-branch-prune.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  remove-seven-historical-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Delete only fixed SHA unprotected branches with no open PR
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const expected = new Map([
              ["dependabot/npm_and_yarn/apps/web/frontend-minor-patch-7601770d6a", "f9924b79c5fbc80b840b278e1ecb87d056300a16"],
              ["dependabot/npm_and_yarn/apps/web/typescript-7.0.2", "caf5a64c4322cc9be744b4fcaabf13247a5f44b4"],
              ["docs/v175-b-external-operator-trust-boundary", "c103f148dc933f286762d439f95e090d5bc4641c"],
              ["feat/v114-warehouse-directory-orval", "f598a4c767547a236bf0a45588fb538c08710baa"],
              ["fix/v124-a3-warehouse-browser-v113-assertion", "3598fd1c5cce29c6875dc26070f309659f903186"],
              ["fix/v147-browser-paged-fba-fixture", "08ba1d80a2cc8a087b06fbc4609ffc45b265e1c2"],
              ["migration/react-only-frontend-2026-10-31", "3f4d4000face87b21e30358056fc2f5348ca6043"],
            ]);
            const opens = await github.paginate(github.rest.pulls.list, {owner, repo, state:'open', per_page:100});
            const openHeads = new Set(opens.filter(p => p.head.repo?.full_name === `${owner}/${repo}`).map(p => p.head.ref));
            let removed = 0;
            const skipped = [];
            for (const [name, sha] of expected) {
              if (name === 'main' || openHeads.has(name)) { skipped.push(name + ': main or open PR'); continue; }
              try {
                const b = (await github.rest.repos.getBranch({owner,repo,branch:name})).data;
                if (b.protected || b.commit.sha !== sha) { skipped.push(name + ': protected or moved'); continue; }
                await github.rest.git.deleteRef({owner,repo,ref:`heads/${name}`});
                core.info(`Deleted ${name} at ${sha}`);
                removed++;
              } catch(err) { skipped.push(`${name}: ${err.status||''} ${err.message}`); }
            }
            await core.summary.addHeading('Direct-main branch cleanup').addRaw(`Deleted ${removed}/7; exceptions: ${skipped.length}`).write();
            skipped.forEach(v => core.error(v));
            if (skipped.length) core.setFailed(skipped.join('; '));
