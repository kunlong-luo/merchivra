# V108/V282: run the full Next Chromium suite at milestones,
# manually, or when the browser test contract itself changes (not every TSX/CSS push).
name: Optional Chromium responsive UI smoke

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-layout-smoke.yml
      - scripts/smoke_browser_layout.mjs
      - scripts/chrome_devtools_port.mjs
      - scripts/chrome_devtools_port.test.mjs

permissions:
  contents: read

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          working-directory: apps/web
          runtime: node@24
          cache: true
          require-lockfile: true
          install: false
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Ensure React-only frontend
        run: node scripts/check_frontend_stack.mjs
      - name: Install CJK fonts in disposable runner for faithful Chinese screenshots
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          # APT refresh can hang on a transient mirror; never spend an entire
          # 18-minute Chromium job before executing the V218 source tests.
          # Preserve the visual quality gate: missing CJK font is a FAILURE,
          # not a silent fallback to tofu screenshots or an A3 success.
          if ! fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -q 'Noto Sans CJK'; then
            if ! timeout 90s sudo apt-get -o Acquire::Retries=1 \
                -o Acquire::http::Timeout=15 install -y \
                --no-install-recommends fonts-noto-cjk; then
              timeout 45s sudo apt-get -o Acquire::Retries=1 \
                -o Acquire::http::Timeout=15 update -qq
              timeout 90s sudo apt-get -o Acquire::Retries=1 \
                -o Acquire::http::Timeout=15 install -y \
                --no-install-recommends fonts-noto-cjk
            fi
          fi
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -q 'Noto Sans CJK'
      - name: Build Next.js 16 App Router production preview
        working-directory: apps/web
        run: pnpm run build:next
      - name: Next App Router Chromium layout and real-workspace fixture smoke
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/web
            ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3355
          ) >/tmp/merchivra-next-browser.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3355/core >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$next_pid" 2>/dev/null; then
              cat /tmp/merchivra-next-browser.log
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          export MERCHIVRA_BROWSER_NEXT_URL=http://127.0.0.1:3355
          node scripts/smoke_browser_layout.mjs browser-smoke-next-artifacts
      - name: Upload Next App Router viewport screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchivra-next16-synthetic-browser-screenshots
          path: browser-smoke-next-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
