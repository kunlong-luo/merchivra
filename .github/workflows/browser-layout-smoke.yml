# V108: full Vite + Next Chromium run is a manually triggered milestone
# or called by milestone-validation.yml, not every TSX/CSS push.
name: Optional Chromium responsive UI smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
          package-manager-cache: false
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Ensure React-only frontend
        run: node scripts/check_frontend_stack.mjs
      - name: Build frontend and check TypeScript
        working-directory: apps/web
        run: npm run build
      - name: Install CJK fonts in disposable runner for faithful Chinese screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC'
      - name: Browser layout and table provenance smoke with synthetic API
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          "$CHROME_BIN" --version
          node --check scripts/smoke_browser_layout.mjs
          node scripts/smoke_browser_layout.mjs apps/web/dist browser-smoke-artifacts
      - name: Build Next.js 16 App Router production preview
        working-directory: apps/web
        run: npm run build:next
      - name: Next App Router Chromium layout and real-workspace fixture smoke
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/web
            ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3355
          ) >/tmp/merchivra-next-browser.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3355/core >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$next_pid" 2>/dev/null; then
              cat /tmp/merchivra-next-browser.log
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          export MERCHIVRA_BROWSER_NEXT_URL=http://127.0.0.1:3355
          node scripts/smoke_browser_layout.mjs apps/web/dist browser-smoke-next-artifacts
      - name: Upload Next App Router viewport screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchivra-next16-synthetic-browser-screenshots
          path: browser-smoke-next-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload viewport screenshots for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchivra-synthetic-browser-screenshots
          path: browser-smoke-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
