# Temporary one-shot migration aid. Regenerates the npm lockfile on the React migration branch.
name: Regenerate React npm lockfile
on:
  push:
    branches: [migration/react-only-frontend-2026-10-31]
    paths:
      - apps/web/package.json
      - .github/workflows/react-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Regenerate lockfile for React
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify React stack and build
        run: |
          node scripts/check_react_only.mjs
          cd apps/web
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Commit only regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): regenerate npm lockfile for React"
            git push origin HEAD:migration/react-only-frontend-2026-10-31
          fi
