# One-shot branch-scoped generation of reviewed Orval output. Delete after use.
name: V95 one-shot generate checked-in Ops client
on:
  push:
    branches:
      - feat/v95-ops-lot-approval-pagination
    paths:
      - .github/workflows/v95-generate-ops-artifacts.yml

permissions:
  contents: read

jobs:
  generated:
    if: github.repository == 'kunlong-luo/merchivra' && github.ref == 'refs/heads/feat/v95-ops-lot-approval-pagination'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate exact Orval files from committed verified V95 SpringDoc
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run api:generate:ops
      - name: Commit only the generated operations clients to this temporary branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/generated/operations-v67.ts apps/web/src/generated/operations-models
          git diff --cached --quiet && exit 0
          git commit -m "gen(V95): synchronize Orval operations client and model types"
          git push origin HEAD:feat/v95-ops-lot-approval-pagination
