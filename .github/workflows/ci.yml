# V108: fast automatic checks on PR/main; full PG18 + Next runtime checks
# via workflow_dispatch(full_suite=true) or milestone-validation.yml.
# High-risk auth, stock, finance and tenant changes still require targeted tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run full PostgreSQL 18, Next production and security regression (milestone only)'
        type: boolean
        required: true
        default: true
  workflow_call:
    inputs:
      full_suite:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: merchivra-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full_suite && 'full' || 'quick' }}
  cancel-in-progress: ${{ inputs.full_suite != true }}

jobs:
  backend:
    name: Java 25 / Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Maven is retired and official Gradle Wrapper is pinned
        run: |
          test ! -e apps/server/pom.xml
          test -x apps/server/gradlew
          printf '%s  %s\n' 423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9 apps/server/gradle/wrapper/gradle-wrapper.jar | sha256sum -c -
          grep -F 'distributionSha256Sum=72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f' apps/server/gradle/wrapper/gradle-wrapper.properties
      - name: Gradle Wrapper tests (fast on every PR and main push)
        run: ./apps/server/gradlew -p apps/server --no-daemon --console plain test
      - name: JaCoCo report (full milestone only)
        if: inputs.full_suite == true
        run: ./apps/server/gradlew -p apps/server --no-daemon --console plain jacocoTestReport

  frontend:
    name: React 19 / Vite baseline + Next.js 16 preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure React-only frontend
        run: node ../../scripts/check_frontend_stack.mjs
      - name: Ensure Orval generated hooks match the reviewed OpenAPI
        run: npm run api:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      # V123: no extra Chromium on every PR, just reject malformed fixture JS.
      - name: Check synthetic browser fixture syntax (full Chromium on milestone)
        run: node --check ../../scripts/smoke_browser_layout.mjs
      - name: Build
        run: npm run build
      - name: Next 16 App Router TS gate
        run: npm run typecheck:next
      - name: Next 16 App Router production build (full milestone only)
        if: inputs.full_suite == true
        run: npm run build:next
      - name: Next 16 standalone App Router HTTP smoke (full milestone only)
        if: inputs.full_suite == true
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3355 >/tmp/merchivra-next-http.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:3355/ >/tmp/next-v99.html; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/merchivra-next-http.log
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1
          for path in / /orders /purchasing /finance /ops /core /connections; do
            code=$(curl --silent --output /tmp/next-v99.html --write-out '%{http_code}' "http://127.0.0.1:3355$path")
            test "$code" = 200 || { cat /tmp/merchivra-next-http.log; exit 1; }
            grep -Fq 'Merchivra ERP' /tmp/next-v99.html
          done
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3355/no-such-workbench-v99)
          test "$status" = 404
          echo 'PASS Next 16 App Router: seven real workbench routes and unknown-route 404; backend credentials absent'

  pg18-migrations:
    name: PostgreSQL 18 / real Flyway migrations
    if: inputs.full_suite == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: merchivra
          POSTGRES_PASSWORD: ci_disposable_database_password
          POSTGRES_DB: merchivra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchivra -d merchivra"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: merchivra
      DB_NAME: merchivra
      DB_PASSWORD: ci_disposable_database_password
      PGPASSWORD: ci_disposable_database_password
      MERCHIVRA_SPAPI_ENABLED: 'false'
      MERCHIVRA_SPAPI_OAUTH_ENABLED: 'false'
      MERCHIVRA_DEMO_ENABLED: 'true'
      MERCHIVRA_TEAM_ENABLED: 'true'
      MERCHIVRA_BOOTSTRAP_USERNAME: 'v65-ci-owner'
      MERCHIVRA_BOOTSTRAP_PASSWORD: 'ci-disposable-v65-only-secret-0000'
      MERCHIVRA_CONTRACT_EXPORT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Start actual Spring Boot against isolated PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          ./apps/server/gradlew -p apps/server --no-daemon --console plain bootRun \
            > /tmp/merchivra-flyway.log 2>&1 &
          app_pid=$!
          ready=0
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8080/api/v1/ping >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Spring Boot startup process exited before health check"
              tail -150 /tmp/merchivra-flyway.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Spring Boot / Flyway failed to become ready"
            tail -150 /tmp/merchivra-flyway.log
            exit 1
          fi
          major=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SHOW server_version_num")
          test "${major:0:2}" = "18"
          migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc \
            "SELECT count(*) FROM flyway_schema_history WHERE version IN ('46','47','48','49','50','51','52') AND success")
          test "$migration" = "7"
          psql -h 127.0.0.1 -U merchivra -d merchivra -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM erp_local_lot_disposition_proof_file WHERE size_bytes > 2097152"
          psql -h 127.0.0.1 -U merchivra -d merchivra -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM erp_lot_supplier_return_trace"
          # V129: real PG18 verifies the forward-only V84 audit migration.
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='84' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='85' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='86' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='87' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='88' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='89' AND success")" = "1"
          # V147: actual forward-only PostgreSQL18 source paging indexes must exist.
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='90' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='fba_purchase_link_history_page_v90'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='erp_purchase_order_candidate_page_v90'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='erp_purchase_asn_candidate_page_v90'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='erp_lot_proof_capacity_threshold_audit_recent_idx'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='erp_lot_proof_gov_audit_recent_idx'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='erp_local_lot_position_expiry_page_idx'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='erp_local_lot_position_warehouse_recent_idx'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='erp_local_lot_position_receipt_root_idx'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_indexes WHERE indexname='erp_local_lot_action_destination_recent_idx'")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM pg_constraint WHERE conname='erp_lot_proof_file_tenant_proof_id_unique'")" = "1"
          psql -h 127.0.0.1 -U merchivra -d merchivra -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM erp_local_lot_proof_file_download_audit"
          curl -fsS http://127.0.0.1:8080/v3/api-docs/finance-profits > /tmp/merchivra-live-finance-openapi.json
          node scripts/normalize-finance-openapi.mjs /tmp/merchivra-live-finance-openapi.json /tmp/merchivra-normalized-finance-openapi.json
          cmp apps/web/openapi/finance-profits.json /tmp/merchivra-normalized-finance-openapi.json
          curl -fsS http://127.0.0.1:8080/v3/api-docs/fba-inbound > /tmp/merchivra-live-fba-openapi.json
          node scripts/normalize-fba-openapi.mjs /tmp/merchivra-live-fba-openapi.json /tmp/merchivra-normalized-fba-openapi.json
          diff -u apps/web/openapi/fba-inbound.json /tmp/merchivra-normalized-fba-openapi.json || true
          cmp apps/web/openapi/fba-inbound.json /tmp/merchivra-normalized-fba-openapi.json
          cp /tmp/merchivra-normalized-fba-openapi.json apps/web/openapi/fba-inbound.json
          (
            cd apps/web
            npm ci --no-audit --no-fund
            npm run api:generate:fba
          )
          test -s apps/web/src/generated/fba-inbound.ts
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='63' AND success")" = "1"
          curl -fsS http://127.0.0.1:8080/v3/api-docs/ads-reports > /tmp/ads-live.json
          node scripts/normalize-ads-openapi.mjs /tmp/ads-live.json /tmp/ads-verified.json
          cmp apps/web/openapi/ads-reports.json /tmp/ads-verified.json
          cp /tmp/ads-verified.json apps/web/openapi/ads-reports.json
          (
            cd apps/web
            npm run api:generate:ads
          )
          test -s apps/web/src/generated/ads-reports.ts
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM ads_report_reviewed_cost")" = "0"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM ads_profile_reference")" = "0"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='64' AND success")" = "1"
          curl -fsS http://127.0.0.1:8080/v3/api-docs/operations-v67 > /tmp/ops-live.json
          node scripts/normalize-ops-openapi.mjs /tmp/ops-live.json /tmp/ops-normalized.json
          cmp apps/web/openapi/operations-v67.json /tmp/ops-normalized.json
          cp /tmp/ops-normalized.json apps/web/openapi/operations-v67.json
          (
            cd apps/web
            npm run api:generate:ops
          )
          test -s apps/web/src/generated/operations-v67.ts
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='65' AND success")" = "1"
          python3 scripts/smoke_fba_inbound.py
          psql -h 127.0.0.1 -U merchivra -d merchivra -v ON_ERROR_STOP=1 -f scripts/smoke_ads_schema.sql
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='66' AND success")" = "1"
          python3 scripts/smoke_ops_v67.py
          python3 scripts/smoke_ops_v69.py
          python3 scripts/smoke_replenishment_v70.py
          python3 scripts/smoke_replenishment_supplier_v71.py
          python3 scripts/smoke_purchase_delivery_v72.py
          python3 scripts/smoke_supplier_performance_v73.py
          python3 scripts/smoke_replenishment_priority_v74.py
          python3 scripts/smoke_fba_purchase_links_v75.py
          python3 scripts/smoke_fba_purchase_reconciliation_v76.py
          python3 scripts/smoke_fba_purchase_exceptions_v77.py
          python3 scripts/smoke_fba_purchase_ops_v78.py
          python3 scripts/smoke_fba_purchase_assignment_v79.py
          python3 scripts/smoke_exception_insights_v80.py
          python3 scripts/smoke_exception_history_v81.py
          python3 scripts/smoke_exception_workflow_v82.py
          python3 scripts/smoke_fba_exception_preflight_v83.py
          python3 scripts/smoke_fba_owner_audit_v84.py
          python3 scripts/smoke_fba_ops_capability_v85.py
          python3 scripts/smoke_core_orders_pagination_v86.py
          python3 scripts/smoke_core_listings_pagination_v87.py
          python3 scripts/smoke_core_fba_inventory_page_v88.py
          python3 scripts/smoke_business_source_quality_v89.py
          python3 scripts/smoke_cross_module_full_store_v90.py
          python3 scripts/smoke_fba_catalog_purchasing_full_selection_v91.py
          python3 scripts/smoke_fba_local_history_supplier_sku_v92.py
          python3 scripts/smoke_paged_local_purchasing_v92.py
          python3 scripts/smoke_purchase_orders_page_v110.py
          python3 scripts/smoke_supplier_pages_v111.py
          python3 scripts/smoke_warehouse_ledger_pages_v112.py
          python3 scripts/smoke_warehouse_read_pages_v113.py
          python3 scripts/smoke_warehouse_directory_v114.py
          python3 scripts/smoke_receipt_operational_pages_v93.py
          python3 scripts/smoke_quality_returns_findings_v94.py
          python3 scripts/smoke_ops_lot_pagination_v95.py
          python3 scripts/smoke_lot_history_v132.py
          python3 scripts/smoke_released_lot_positions_v133.py
          python3 scripts/smoke_lot_expiry_alerts_v134.py
          MERCHIVRA_V135_DISPOSABLE_ONLY=true python3 scripts/check_lot_query_plans_v135.py
          python3 scripts/smoke_proof_governance_v138.py
          python3 scripts/smoke_proof_monitor_v140.py
          python3 scripts/smoke_supplier_case_pages_v96.py
          python3 scripts/smoke_supplier_finance_settlement_pages_v97.py
          python3 scripts/smoke_finance_audit_pages_v98.py
          # V164: actual isolated PG18/HTTP manual cost proposal/approval,
          # source+allocation audit immutability and exact unallocated remainder.
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='91' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='92' AND success")" = "1"
          MERCHIVRA_V164_DISPOSABLE_ONLY=true python3 scripts/smoke_cost_allocation_v164.py
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='81' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='80' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='79' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='78' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='77' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='76' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='75' AND success")" = "1"
          test "$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='74' AND success")" = "1"
          v75_migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='73' AND success")
          test "$v75_migration" = "1"
          v74_migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='71' AND success")
          test "$v74_migration" = "1"
          v74_origin_migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='72' AND success")
          test "$v74_origin_migration" = "1"
          v73_migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='70' AND success")
          test "$v73_migration" = "1"
          v72_migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='69' AND success")
          test "$v72_migration" = "1"
          v71_migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='68' AND success")
          test "$v71_migration" = "1"
          v70_migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='67' AND success")
          test "$v70_migration" = "1"
          MERCHIVRA_V68_DISPOSABLE_ONLY=true python3 scripts/smoke_http_security_v68.py
          # V101: verify the REAL Spring Session and CSRF transport via a
          # disposable Next.js reverse proxy on the same loopback runner.
          # No Seller OAuth, remote SP-API, production data or real credentials.
          (
            cd apps/web
            MERCHIVRA_API_INTERNAL_URL=http://127.0.0.1:8080 npm run build:next
            MERCHIVRA_API_INTERNAL_URL=http://127.0.0.1:8080 \
              ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3355 \
              >/tmp/merchivra-next-v101-session.log 2>&1 &
            next_pid=$!
            trap 'kill "$next_pid" 2>/dev/null || true' EXIT
            next_ready=0
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:3355/ >/dev/null 2>&1; then
                next_ready=1
                break
              fi
              if ! kill -0 "$next_pid" 2>/dev/null; then
                tail -100 /tmp/merchivra-next-v101-session.log
                exit 1
              fi
              sleep 1
            done
            test "$next_ready" = 1
            MERCHIVRA_V101_DISPOSABLE_ONLY=true python3 \
              ../../scripts/smoke_next_session_csrf_v101.py
          )
          # V141: actual PG18 service-container filesystem, actual read-only
          # pg_catalog WAL/database bytes and the successful isolated V68 restore.
          # This is a disposable sample, NOT a production readiness grant.
          v141_attest="$(mktemp /tmp/merchivra-v141-attest-XXXXXX.json)"
          v141_disk="$(mktemp /tmp/merchivra-v141-disk-XXXXXX.json)"
          MERCHIVRA_V141_ATTESTATION_FILE="$v141_attest" \
            MERCHIVRA_V68_DISPOSABLE_ONLY=true bash scripts/smoke_pg_restore_v68.sh
          docker exec -i "${{ job.services.postgres.id }}" sh -s \
            < scripts/collect_pg18_disk_v141.sh > "$v141_disk"
          python3 scripts/pg18_ops_probe_v141.py --mode disposable \
            --disk-json "$v141_disk" --backup-json "$v141_attest" \
            --disk-warn-percent 20 --disk-critical-percent 10 \
            --wal-warn-bytes 536870912 --wal-critical-bytes 2147483648 \
            --backup-max-age-hours 24 --restore-max-age-hours 24 \
            --prometheus-file /tmp/merchivra-v141-pg18.prom \
            > /tmp/merchivra-v141-ops.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/merchivra-v141-ops.json').read_text())
          assert r['mode']=='disposable' and r['productionApproved'] is False
          assert r['alertReceiverVerified'] is False
          assert r['measurements']['databaseBytes']>0
          assert r['measurements']['walDirectoryBytes']>0
          assert r['measurements']['filesystemAvailableBytes']>0
          assert any(c['code']=='PITR_WAL_ARCHIVING' and c['status']=='BLOCKED'
                     for c in r['checks']), 'Disposable pg_dump is NOT PITR'
          metrics=Path('/tmp/merchivra-v141-pg18.prom').read_text()
          assert 'merchivra_pg18_ops_production_approved 0' in metrics
          print('PASS V141 disposable local PG18 ops: measured disk/WAL, verified restore, never production approval')
          PY
          rm -f -- "$v141_attest" "$v141_disk"
          # V142: true physical PG18 basebackup + archived WAL recovery to
          # the server timestamp between two committed fictional markers.
          # A second restored container MUST pause and EXCLUDE later commits.
          v142_pitr="$(mktemp /tmp/merchivra-v142-pitr-XXXXXX.json)"
          MERCHIVRA_V142_DISPOSABLE_ONLY=true \
            MERCHIVRA_V142_PITR_EVIDENCE_FILE="$v142_pitr" \
            bash scripts/smoke_pg18_pitr_v142.sh
          # V142: real Alertmanager API and webhook delivery on a Docker
          # --internal network; no external recipient or published port.
          v142_alert="$(mktemp /tmp/merchivra-v142-alert-XXXXXX.json)"
          MERCHIVRA_V142_DISPOSABLE_ONLY=true \
            MERCHIVRA_V142_ALERT_EVIDENCE_FILE="$v142_alert" \
            bash scripts/smoke_alertmanager_v142.sh
          python3 - "$v142_pitr" "$v142_alert" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          a=json.loads(Path(sys.argv[2]).read_text())
          assert p['mode']=='disposable' and p['postgresMajor']==18
          assert all(p[k] for k in ('archivedWalSegment','physicalBasebackup',
              'recoveryTargetPaused','includedCommittedBeforeTarget',
              'excludedCommittedAfterTarget'))
          assert p['productionPitrApproved'] is False
          assert a['source']=='real_alertmanager_v142_local'
          assert a['status']=='firing' and a['receiver']=='ci-local-webhook'
          assert a['externalRecipientVerified'] is False
          assert a['productionApproved'] is False
          print('PASS V142 A3: real local PG18 timestamp PITR + internal Alertmanager delivery; production blocked')
          PY
          # Leave only sanitized JSON evidence for 7-day Actions artifact.
          # Never upload basebackup, archived WAL or raw webhook payload.
          echo "PostgreSQL 18 / Flyway / actual finance + FBA OpenAPI and local mock chain verified"
          kill "$app_pid" 2>/dev/null || true
      - name: Preserve V141 disposable disk/WAL/PITR-not-ready metrics (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v141-disposable-pg18-ops-evidence
          path: |
            /tmp/merchivra-v141-ops.json
            /tmp/merchivra-v141-pg18.prom
          if-no-files-found: warn
          retention-days: 7
      - name: V142 audit-only PITR and private Alertmanager delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v142-disposable-pitr-alertmanager-evidence
          path: |
            /tmp/merchivra-v142-pitr-*.json
            /tmp/merchivra-v142-alert-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve verified V65 OpenAPI contract for Orval review
        uses: actions/upload-artifact@v4
        with:
          name: v65-fba-live-openapi
          path: |
            apps/web/openapi/fba-inbound.json
            apps/web/src/generated/fba-inbound.ts
            apps/web/src/generated/fba-models/
          if-no-files-found: error
          retention-days: 7

  compose-deployment-config:
    name: Docker Compose / three-service and spark-db modes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MERCHIVRA_DB_PASSWORD: ci_disposable_not_an_actual_secret
    steps:
      - uses: actions/checkout@v5
      - name: Verify V108 quick versus full workflow cadence
        run: python3 scripts/check_ci_cadence_v108.py
      - name: Verify V109 active documentation links and runtime status
        run: python3 scripts/check_docs_consistency_v109.py
      - name: V140 synthetic Owner HTTP smoke Python syntax
        run: python3 -m py_compile scripts/smoke_proof_monitor_v140.py
      - name: V141 read-only disk/WAL/backup readiness probe contracts
        run: |
          sh -n scripts/collect_pg18_disk_v141.sh
          bash -n scripts/smoke_pg_restore_v68.sh
          python3 -m py_compile scripts/pg18_ops_probe_v141.py
          python3 -m unittest discover -s scripts -p 'test_pg18_ops_v141.py' -v
      - name: V142 PITR and real Alertmanager isolated smoke syntax and refusal gate
        run: |
          bash -n scripts/smoke_pg18_pitr_v142.sh
          bash -n scripts/smoke_alertmanager_v142.sh
          python3 -m py_compile scripts/v142_alert_loopback.py
          if env -u GITHUB_ACTIONS MERCHIVRA_V142_DISPOSABLE_ONLY=true \
            bash scripts/smoke_pg18_pitr_v142.sh; then
            echo 'Unsafe V142 PITR mode unexpectedly accepted non-CI' >&2
            exit 1
          fi
          if env -u GITHUB_ACTIONS MERCHIVRA_V142_DISPOSABLE_ONLY=true \
            bash scripts/smoke_alertmanager_v142.sh; then
            echo 'Unsafe V142 Alertmanager mode unexpectedly accepted non-CI' >&2
            exit 1
          fi
          echo 'PASS V142 fail-closed: non-CI/real execution refused before Docker or SQL'
      - name: V146 HTTPS localhost-only Nginx cutover contracts and refuse-prod tests
        run: |
          bash -n scripts/smoke_https_cutover_v146.sh
          python3 -m py_compile scripts/smoke_https_cutover_v146.py
          python3 -m unittest discover -s scripts -p 'test_https_cutover_v146.py' -v
          if env -u GITHUB_ACTIONS MERCHIVRA_V146_DISPOSABLE_ONLY=true \
            bash scripts/smoke_https_cutover_v146.sh; then
            echo 'V146 unacceptable: non-CI HTTPS canary accepted' >&2
            exit 1
          fi
          echo 'PASS V146 refusal + only fixed localhost TLS and safe backend switches'
      - name: V151 operator-only target ingress guard and offline HTTPS checks
        run: |
          python3 -m py_compile scripts/check_next_target_ingress_v151.py
          python3 -m unittest discover -s scripts -p 'test_next_target_ingress_v151.py' -v
          echo 'PASS V151: operator-only target HTTPS observations; no external requests in CI'
      - name: V143 fail-closed production readiness and human approval contracts
        run: |
          python3 -m py_compile scripts/check_production_gate_v143.py
          python3 -m unittest discover -s scripts -p 'test_production_gate_v143.py' -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('ops/release/v143-production-evidence-template.json').read_text())
          assert not d['productionApproved'] and not d['deploymentPermitted']
          assert all(x['status']=='pending' for x in d['controls'].values())
          print('PASS V143 pending-only release evidence template (no synthetic approvals)')
          PY
      - name: V158 redacted-only production evidence owner worklist (always NO-GO)
        run: |
          python3 -m py_compile scripts/production_evidence_worklist_v158.py
          python3 -m unittest discover -s scripts -p 'test_production_evidence_worklist_v158.py' -v
          echo 'PASS V158: fixed role worklist from redacted V143 result; never grants production'
      - name: V160 read-only image ID and OCI source/revision gates
        run: |
          python3 -m py_compile scripts/check_target_image_ids_v160.py
          python3 -m unittest discover -s scripts -p 'test_target_image_ids_v160.py' -v
          echo 'PASS V160: operator-only fixed Docker metadata; every result remains NO-GO'
      - name: V135 EXPLAIN JSON and plan assertions (no database needed)
        run: |
          python3 -m py_compile scripts/check_lot_query_plans_v135.py
          python3 scripts/check_lot_query_plans_v135.py --self-test
      - name: V122 fail-closed Next Node runtime image and Vite rollback contract
        run: python3 scripts/check_next_runtime_v122.py
      - name: Validate both documented deployment modes without using real databases
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f deploy/compose.yaml config -q
          docker compose --env-file .env.example -f deploy/compose.yaml \
            -f deploy/compose.next.yaml \
            -f deploy/compose.v146-synthetic-https.yaml config -q
          bundled=$(docker compose --env-file .env.example -f deploy/compose.yaml config --services | sort | tr '\n' ' ')
          test "$bundled" = "postgres server web "
          docker compose --env-file .env.example -f deploy/compose.yaml --profile optional-cache config -q
          docker compose --env-file .env.example -f deploy/compose.yaml --profile optional-cache config --services | grep -Fx redis
          docker compose --env-file .env.example -f deploy/compose.spark-db.yaml config -q
          external=$(docker compose --env-file .env.example -f deploy/compose.spark-db.yaml config --services | sort | tr '\n' ' ')
          test "$external" = "server web "
          docker compose --env-file .env.example -f deploy/compose.spark-db.yaml config | grep -F 'spark-iot-net'
          docker compose --env-file .env.example -f deploy/compose.spark-db.yaml config | grep -F 'spark-postgres'
          docker compose --env-file .env.example -f deploy/compose.spark-db.yaml -f deploy/compose.production.yaml config -q
          docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.production.yaml --profile optional-cache config --format json |
            python3 scripts/check_release_config_v68.py
          docker compose --env-file .env.example -f deploy/compose.yaml \
            -f deploy/compose.next.yaml config --format json |
            python3 scripts/check_next_runtime_v122.py --compose
          # V153: execute the exact YAML healthcheck Node expression with
          # mocked responses; CI must never contact a real target.
          docker compose --env-file .env.example -f deploy/compose.yaml \
            -f deploy/compose.next.yaml config --format json |
            node scripts/test_next_health_v153.mjs
          docker compose --env-file .env.example -f deploy/compose.yaml \
            -f deploy/compose.production.yaml -f deploy/compose.next.yaml \
            config --format json |
            python3 scripts/check_next_runtime_v122.py --compose --production
          # V143: verify the real evaluated production+Next overlay remains
          # BLOCKED with a demo .env and no external signoffs. The JSON input
          # may contain secrets; ONLY bounded, redacted check codes are saved.
          set +e
          docker compose --env-file .env.example -f deploy/compose.yaml \
            -f deploy/compose.production.yaml -f deploy/compose.next.yaml \
            --profile optional-cache config --format json |
            python3 scripts/check_production_gate_v143.py --compose-stdin \
              --candidate-sha "$GITHUB_SHA" \
              > /tmp/merchivra-v143-production-gate-blocked.json
          v143_status=$?
          set -e
          test "$v143_status" -eq 2 || {
            echo 'V143 release gate unexpectedly bypassed or errored' >&2
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/merchivra-v143-production-gate-blocked.json').read_text())
          assert r['status']=='BLOCKED'
          assert r['productionApproved'] is False
          assert r['deploymentPermitted'] is False
          assert r['automaticReleasePossible'] is False
          assert r['operatorEvidenceIsSelfAttested'] is True
          for k in ('PRIVATE_AV_HOST_CONFIGURED',
                    'DB_BOOTSTRAP_SECRET_NOT_PLACEHOLDER'):
              assert k in r['blockedChecks']['compose'],k
          assert 'external_pager_delivered_and_acknowledged' in r['blockedChecks']['operatorEvidence']
          assert 'production_wal_archiving_pitr_restore' in r['blockedChecks']['operatorEvidence']
          assert 'product_scope_owner' in r['blockedChecks']['operatorEvidence']
          assert 'https_trusted_proxy_live' in r['blockedChecks']['operatorEvidence']
          print('PASS V143 actual merged compose: G1/G2/G3 and missing target infra BLOCKED, no deployed runtime')
          PY
          echo "PASS: three bundled services, optional Redis, external spark-db reuse, production overlay"
      - name: V143 redacted G1/G2/G3 release-block evidence (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-release-preflight-blocked
          path: /tmp/merchivra-v143-production-gate-blocked.json
          if-no-files-found: warn
          retention-days: 7

