name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merchivra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java 25 / Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Maven is retired and official Gradle Wrapper is pinned
        run: |
          test ! -e apps/server/pom.xml
          test -x apps/server/gradlew
          printf '%s  %s\n' 423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9 apps/server/gradle/wrapper/gradle-wrapper.jar | sha256sum -c -
          grep -F 'distributionSha256Sum=72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f' apps/server/gradle/wrapper/gradle-wrapper.properties
      - name: Gradle Wrapper test and JaCoCo report
        run: ./apps/server/gradlew -p apps/server --no-daemon --console plain test jacocoTestReport

  frontend:
    name: React 19 / TypeScript / Vitest / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure React-only frontend
        run: node ../../scripts/check_frontend_stack.mjs
      - name: Ensure Orval generated hooks match the reviewed OpenAPI
        run: npm run api:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  pg18-migrations:
    name: PostgreSQL 18 / real Flyway migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: merchivra
          POSTGRES_PASSWORD: ci_disposable_database_password
          POSTGRES_DB: merchivra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchivra -d merchivra"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: merchivra
      DB_NAME: merchivra
      DB_PASSWORD: ci_disposable_database_password
      PGPASSWORD: ci_disposable_database_password
      MERCHIVRA_SPAPI_ENABLED: 'false'
      MERCHIVRA_SPAPI_OAUTH_ENABLED: 'false'
      MERCHIVRA_DEMO_ENABLED: 'false'
      MERCHIVRA_TEAM_ENABLED: 'false'
      MERCHIVRA_CONTRACT_EXPORT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Start actual Spring Boot against isolated PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          ./apps/server/gradlew -p apps/server --no-daemon --console plain bootRun \
            > /tmp/merchivra-flyway.log 2>&1 &
          app_pid=$!
          ready=0
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8080/api/v1/ping >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Spring Boot startup process exited before health check"
              tail -150 /tmp/merchivra-flyway.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Spring Boot / Flyway failed to become ready"
            tail -150 /tmp/merchivra-flyway.log
            exit 1
          fi
          major=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc "SHOW server_version_num")
          test "${major:0:2}" = "18"
          migration=$(psql -h 127.0.0.1 -U merchivra -d merchivra -Atc \
            "SELECT count(*) FROM flyway_schema_history WHERE version IN ('46','47','48','49','50','51','52') AND success")
          test "$migration" = "7"
          psql -h 127.0.0.1 -U merchivra -d merchivra -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM erp_local_lot_disposition_proof_file WHERE size_bytes > 2097152"
          psql -h 127.0.0.1 -U merchivra -d merchivra -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM erp_lot_supplier_return_trace"
          curl -fsS http://127.0.0.1:8080/v3/api-docs/finance-profits > /tmp/merchivra-live-finance-openapi.json
          node scripts/normalize-finance-openapi.mjs /tmp/merchivra-live-finance-openapi.json /tmp/merchivra-normalized-finance-openapi.json
          cmp apps/web/openapi/finance-profits.json /tmp/merchivra-normalized-finance-openapi.json
          echo "PostgreSQL 18 / Flyway / actual finance OpenAPI snapshot verified against a real server"
          kill "$app_pid" 2>/dev/null || true

  compose-deployment-config:
    name: Docker Compose / three-service and spark-db modes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MERCHIVRA_DB_PASSWORD: ci_disposable_not_an_actual_secret
    steps:
      - uses: actions/checkout@v5
      - name: Validate both documented deployment modes without using real databases
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f deploy/compose.yaml config -q
          bundled=$(docker compose --env-file .env.example -f deploy/compose.yaml config --services | sort | tr '\n' ' ')
          test "$bundled" = "postgres server web "
          docker compose --env-file .env.example -f deploy/compose.yaml --profile optional-cache config -q
          docker compose --env-file .env.example -f deploy/compose.yaml --profile optional-cache config --services | grep -Fx redis
          docker compose --env-file .env.example -f deploy/compose.spark-db.yaml config -q
          external=$(docker compose --env-file .env.example -f deploy/compose.spark-db.yaml config --services | sort | tr '\n' ' ')
          test "$external" = "server web "
          docker compose --env-file .env.example -f deploy/compose.spark-db.yaml config | grep -F 'spark-iot-net'
          docker compose --env-file .env.example -f deploy/compose.spark-db.yaml config | grep -F 'spark-postgres'
          docker compose --env-file .env.example -f deploy/compose.spark-db.yaml -f deploy/compose.production.yaml config -q
          echo "PASS: three bundled services, optional Redis, external spark-db reuse, production overlay"
