          MERCHIVRA_V198_DISPOSABLE_ONLY=true python3 scripts/smoke_settlement_source_identity_v198.py
          MERCHIVRA_V200_DISPOSABLE_ONLY=true python3 scripts/smoke_order_cost_ambiguity_v200.py
