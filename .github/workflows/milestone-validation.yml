# Full A3: disposable PG18, Java, Next/Chromium and Compose only.
# Historic milestone commentary is retained in Git and domain evidence documents.
# Current validation scope: docs/current-status.md and docs/testing/ci-policy.md.
name: MVP milestone full validation
run-name: "MVP gate · ${{ inputs.milestone || 'V273-A3-settlement-category-preview' }} · ${{ github.sha }}"

