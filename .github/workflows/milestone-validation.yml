# V135: one exact-main-SHA full A3 after PG18 12k-position/6k-action
# EXPLAIN ANALYZE BUFFERS seven-query regression, no production data.
# V134: one exact-main-SHA full A3 after V49 expiry-alert keysets,
# PG18 Flyway V87, 325-row real HTTP full navigation and cursor checks.
# V133: one exact-main-SHA full A3 after V48 325-position paging,
# exact receipt source allocation and PG18 Flyway V86 true HTTP proof.
# V132: one exact-main-SHA full A3 on V49 source/destination action history
# keyset, V85 PG18 index and 225-record authenticated true HTTP smoke.
# V131: rerun exact-main-SHA full A3 after Next V104 hydration-safe
# dialog open regression while retaining one-confirmation-only write assertions.
# V130: one post-merge exact-main-SHA full A3 after fixing FIFO/FEFO
# >500 position selection and the React preview lower-bound contract.
# V129: one exact-main-SHA full A3 after adding the forward-only PG18
# V84 private original-download audit and fail-closed Java behavior.
# V128: one post-merge full A3 on the private Next -> Spring Compose
# readiness healthcheck change, in addition to the existing real PG18/Chromium gates.
# V126: finalize Chromium Next hydration rule-row regression while
# retaining the real PostgreSQL18+HTTP success of the V125 run.
# V125: full main-SHA PG18 + Chromium milestone recheck after 70-second
# V97 supplier followup query timeout fix (page before ASN/receipt LATERAL).
# V124 A3: repeat complete PG18+Chromium suite on exact merged main SHA
# after V113 wildcard expectation and V107 accessible table label fixes.
# V123 A3: this workflow change triggers a fresh *full* regression at the
# repaired main SHA after V122 PG18 + browser failures. Successful V122
# Docker/Session alone does not count as A3 success.
# V122 A3: merging this workflow update to main intentionally triggers ONE
# full disposable PG18/Flyway + Node standalone/Compose + Chromium validation
# at the merged main SHA. It is NOT production deployment approval.
# V108: one-click, disposable, complete release-candidate regression.
# Run from Actions > MVP milestone full validation > Run workflow (main).
# This contains ONLY existing synthetic/PG18/Compose suites and never
# requests real Amazon Seller, Ads, bank credentials or production databases.
name: MVP milestone full validation
run-name: "MVP gate · ${{ inputs.milestone || 'V135-A3-large-tenant-lot-query-plans' }} · ${{ github.sha }}"

on:
  # Exactly one automatic baseline when this workflow first lands on main
  # (also if the milestone workflow definition itself changes later).
  # Ordinary feature commits do NOT invoke the heavy milestone suite.
  push:
    branches: [main]
    paths:
      - '.github/workflows/milestone-validation.yml'
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Select the release validation point (not production approval)'
        type: choice
        required: true
        default: MVP-freeze
        options:
          - MVP-freeze
          - pre-Beta
          - release-candidate
          - security-regression
          - V122-A3-Next-runtime-baseline
          - V126-A3-Next-ops-and-PG18-final-gate
          - V128-A3-Next-healthcheck-release-gate
          - V129-A3-private-proof-download-audit
          - V130-A3-FIFO-FEFO-500-position-pick
          - V131-A3-Next-V104-confirm-hydration
          - V132-A3-lot-history-keyset-PG18
          - V133-A3-released-lot-all-positions-exact-allocation
          - V134-A3-warehouse-expiry-alert-full-keyset
          - V135-A3-large-tenant-lot-query-plans

permissions:
  contents: read

concurrency:
  group: merchivra-milestone-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  require-main:
    name: Verify main and immutable commit baseline
    runs-on: ubuntu-latest
    steps:
      - name: Disallow unreviewed feature branches and log test scope
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          MILESTONE: ${{ inputs.milestone }}
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "::error::Milestone full test must run on main, not a feature branch"
            exit 1
          }
          printf 'Milestone: %s\nCommit: %s\n' "$MILESTONE" "$GITHUB_SHA"
          echo "Full suites use disposable synthetic data only."

  full-ci:
    name: Full Java / React / Next / PG18 / Security / Flyway / Recovery
    needs: require-main
    uses: ./.github/workflows/ci.yml
    with:
      full_suite: true

  browser:
    name: Vite and Next Chromium synthetic user journeys
    needs: require-main
    uses: ./.github/workflows/browser-layout-smoke.yml

  compose:
    name: Disposable full HTTP and PostgreSQL 18 Compose chain
    needs: require-main
    uses: ./.github/workflows/mock-full-chain.yml
