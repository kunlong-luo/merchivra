name: MVP milestone full validation
run-name: "MVP gate · ${{ inputs.milestone || 'V155-A3-Actuator-vendor-JSON-private-PG18-readiness' }} · ${{ github.sha }}"

on:
  # Exactly one automatic baseline when this workflow first lands on main
  # (also if the milestone workflow definition itself changes later).
  # Ordinary feature commits do NOT invoke the heavy milestone suite.
  push:
    branches: [main]
    paths:
      - '.github/workflows/milestone-validation.yml'
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Select the release validation point (not production approval)'
        type: choice
        required: true
        default: MVP-freeze
        options:
          - MVP-freeze
          - pre-Beta
          - release-candidate
          - security-regression
          - V122-A3-Next-runtime-baseline
          - V126-A3-Next-ops-and-PG18-final-gate
          - V128-A3-Next-healthcheck-release-gate
          - V129-A3-private-proof-download-audit
          - V130-A3-FIFO-FEFO-500-position-pick
          - V131-A3-Next-V104-confirm-hydration
          - V132-A3-lot-history-keyset-PG18
          - V133-A3-released-lot-all-positions-exact-allocation
          - V134-A3-warehouse-expiry-alert-full-keyset
          - V135-A3-large-tenant-lot-query-plans
          - V136-A3-index-first-lot-query-plans
          - V137-A3-private-evidence-av-fail-closed
          - V138-A3-private-proof-governance-no-delete
          - V139-A3-V138-owner-CSRF-refresh
          - V140-A3-proof-audit-capacity-warning
          - V141-A3-PG18-WAL-disk-restore-observability
          - V142-A3-isolated-PG18-PITR-Alertmanager-delivery
          - V143-A3-failclosed-G1-G2-G3-production-preflight
          - V144-A3-session-cache-11-Next-routes-purchasing-P0
          - V145-A3-FBA-PO-ASN-generated-contracts
          - V146-A3-disposable-HTTPS-Next-Vite-session-cutover
          - V147-A3-FBA-PO-ASN-full-source-keysets
          - V148-A3-FBA-keyset-Chromium-fixture-recheck
          - V149-A3-local-HTTPS-canary-safe-stage-diagnostics
          - V150-A3-HTTPS-secure-auth-readiness-gate
          - V153-A3-Next-Node-Spring-identity-healthcheck
          - V154-A3-Next-PG18-Actuator-private-readiness
          - V155-A3-Actuator-vendor-JSON-private-PG18-readiness

permissions:
  contents: read

concurrency:
  group: merchivra-milestone-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  require-main:
    name: Verify main and immutable commit baseline
    runs-on: ubuntu-latest
    steps:
      - name: Disallow unreviewed feature branches and log test scope
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          MILESTONE: ${{ inputs.milestone }}
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "::error::Milestone full test must run on main, not a feature branch"
            exit 1
          }
          printf 'Milestone: %s\nCommit: %s\n' "$MILESTONE" "$GITHUB_SHA"
          echo "Full suites use disposable synthetic data only."

  full-ci:
    name: Full Java / React / Next / PG18 / Security / Flyway / Recovery
    needs: require-main
    uses: ./.github/workflows/ci.yml
    with:
      full_suite: true

  browser:
    name: Vite and Next Chromium synthetic user journeys
    needs: require-main
    uses: ./.github/workflows/browser-layout-smoke.yml

  compose:
    name: Disposable full HTTP and PostgreSQL 18 Compose chain
    needs: require-main
    uses: ./.github/workflows/mock-full-chain.yml
