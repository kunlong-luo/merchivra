name: Orval finance contract bootstrap

on:
  push:
    branches: [main]
    paths: [.github/workflows/api-contract-bootstrap.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: merchivra
          POSTGRES_PASSWORD: ci_disposable_database_password
          POSTGRES_DB: merchivra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchivra -d merchivra"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: merchivra
      DB_NAME: merchivra
      DB_PASSWORD: ci_disposable_database_password
      MERCHIVRA_CONTRACT_EXPORT_ENABLED: 'true'
      MERCHIVRA_SPAPI_ENABLED: 'false'
      MERCHIVRA_DEMO_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Generate real Spring Boot OpenAPI in isolated localhost
        shell: bash
        run: |
          set -euo pipefail
          ./apps/server/gradlew -p apps/server --no-daemon --console plain bootRun > /tmp/finance-contract.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8080/api/v1/ping >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then tail -90 /tmp/finance-contract.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then tail -90 /tmp/finance-contract.log; exit 1; fi
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/v3/api-docs/finance-profits > /tmp/finance-live.json
          node scripts/normalize-finance-openapi.mjs \
            /tmp/finance-live.json apps/web/openapi/finance-profits.json
      # Regenerate after config updates; generated files stay committed.
      - name: Install Orval from real npm registry and generate React Query client
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact orval@8.44.0 --no-audit --no-fund
          npm run api:generate
          npm run typecheck
          npm run test
          npm run build
      - name: Commit reproducible npm lock, generated OpenAPI and clients
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json \
            apps/web/openapi/finance-profits.json apps/web/src/generated
          git diff --cached --quiet && exit 0
          git commit -m "build(orval): lock verified Orval dependency and generated finance hooks"
          git push origin HEAD:main
