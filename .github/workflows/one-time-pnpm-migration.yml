name: One-time pnpm-only migration on main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-pnpm-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-pnpm-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install pinned pnpm and Node 24 without another package manager
        uses: pnpm/setup@v3
        with:
          working-directory: apps/web
          version: 12.20.0
          runtime: node@24
          install: false
      - name: Apply reviewed pnpm-only command and configuration migration
        run: python3 scripts/migrate_pnpm_v191.py
      - name: Import existing dependency pins and verify frozen lockfile
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          pnpm import
          test -s pnpm-lock.yaml
          rm package-lock.json
          pnpm install --frozen-lockfile
          ! grep -Fq 'set this to true or false' pnpm-workspace.yaml
          pnpm api:check
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm build:vite
          VITE_PUBLIC_DEMO=true pnpm build:vite
      - name: Enforce package-manager, docs, and fail-closed runtime rules
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check_frontend_stack.mjs
          python3 scripts/check_ci_cadence_v108.py
          python3 scripts/check_docs_consistency_v109.py
          python3 scripts/check_next_runtime_v122.py
          python3 -m py_compile scripts/check_ci_cadence_v108.py scripts/check_next_runtime_v122.py
          node scripts/check_pages_dist.mjs apps/web/dist
          docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.next.yaml config --format json |
            python3 scripts/check_next_runtime_v122.py --compose
          git diff --check
      - name: Commit tested pnpm migration directly to main and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/migrate_pnpm_v191.py .github/workflows/one-time-pnpm-migration.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          test -f apps/web/pnpm-lock.yaml
          test ! -e apps/web/package-lock.json
          git commit -m "build: migrate frontend, Docker, CI and docs to pnpm 12 only"
          git push origin HEAD:main
