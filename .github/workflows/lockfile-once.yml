# One-shot maintainer workflow. It deletes this file in its own commit.
# Purpose: create a genuine registry-resolved npm lockfile without fabricating package integrity metadata.
name: One-shot npm lockfile
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lockfile-once.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'kunlong-luo/merchivra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve and verify npm dependency lockfile
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test
          npm run build
      - name: Commit lockfile and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          git rm .github/workflows/lockfile-once.yml
          git commit -m 'build(web): lock npm dependency graph for Node 24 and Vite 8'
          git push origin HEAD:main
