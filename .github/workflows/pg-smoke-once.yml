name: One-shot PostgreSQL setup smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pg-smoke-once.yml
permissions:
  contents: write
jobs:
  pg-smoke:
    if: github.repository == 'kunlong-luo/merchivra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: merchivra
          POSTGRES_PASSWORD: local-ci-only-not-a-secret
          POSTGRES_DB: merchivra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchivra -d merchivra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/server/pom.xml
      - name: Start Java API against disposable PostgreSQL 17
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: merchivra
          DB_USER: merchivra
          DB_PASSWORD: local-ci-only-not-a-secret
          MERCHIVRA_BOOTSTRAP_USERNAME: local-smoke-admin
          MERCHIVRA_BOOTSTRAP_PASSWORD: disposable-test-password-2026-only
          MERCHIVRA_DEMO_ENABLED: 'false'
        run: |
          set -eu
          mvn -B -f apps/server/pom.xml spring-boot:run > /tmp/merchivra-pg.log 2>&1 &
          echo $! > /tmp/merchivra-pg.pid
          READY=0
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then
            tail -150 /tmp/merchivra-pg.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/api/v1/ping
      - name: Verify session, CSRF, setup idempotency, marketplace and audit
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8080/api/v1
          COOKIE=/tmp/pg-smoke.cookies

          # Not authenticated: no business data may be read.
          STATUS=$(curl -sS -o /tmp/anonymous.json -w '%{http_code}' "$BASE/seller-accounts")
          test "$STATUS" = 401

          curl -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/auth/csrf" > /tmp/csrf.json
          TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/csrf.json"))["token"])')
          STATUS=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o /tmp/login.json -w '%{http_code}' \
            -X POST -H "X-CSRF-TOKEN: $TOKEN" \
            --data-urlencode username=local-smoke-admin \
            --data-urlencode password=disposable-test-password-2026-only \
            "$BASE/auth/login")
          test "$STATUS" = 200

          curl -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/auth/csrf" > /tmp/csrf.json
          TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/csrf.json"))["token"])')
          curl -fsS -b "$COOKIE" "$BASE/auth/me" > /tmp/me.json

          # Missing CSRF must be rejected.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" \
            -X POST -H 'Content-Type: application/json' \
            -d '{"displayName":"Should Not Save","region":"NA"}' "$BASE/seller-accounts")
          test "$STATUS" = 403

          STATUS=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o /tmp/account.json -w '%{http_code}' \
            -X POST -H "X-CSRF-TOKEN: $TOKEN" -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: local-smoke-key-001' \
            -d '{"displayName":"Local Smoke Store","region":"NA"}' "$BASE/seller-accounts")
          test "$STATUS" = 201
          ACC=$(python3 -c 'import json; d=json.load(open("/tmp/account.json")); assert d["connectionStatus"]=="UNCONFIGURED";print(d["id"])')

          STATUS=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o /tmp/replay.json -w '%{http_code}' \
            -X POST -H "X-CSRF-TOKEN: $TOKEN" -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: local-smoke-key-001' \
            -d '{"displayName":"Local Smoke Store","region":"NA"}' "$BASE/seller-accounts")
          test "$STATUS" = 201
          python3 -c 'import json; a=json.load(open("/tmp/account.json"));b=json.load(open("/tmp/replay.json"));assert a["id"]==b["id"]'

          STATUS=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o /dev/null -w '%{http_code}' \
            -X POST -H "X-CSRF-TOKEN: $TOKEN" -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: local-smoke-key-001' \
            -d '{"displayName":"Changed Store","region":"NA"}' "$BASE/seller-accounts")
          test "$STATUS" = 409

          STATUS=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o /dev/null -w '%{http_code}' \
            -X POST -H "X-CSRF-TOKEN: $TOKEN" -H 'Content-Type: application/json' \
            -d '{"marketplaceId":"A1PA6795UKMFR9"}' "$BASE/seller-accounts/$ACC/marketplaces")
          test "$STATUS" = 400

          STATUS=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o /tmp/marketplace.json -w '%{http_code}' \
            -X POST -H "X-CSRF-TOKEN: $TOKEN" -H 'Content-Type: application/json' \
            -d '{"marketplaceId":"ATVPDKIKX0DER"}' "$BASE/seller-accounts/$ACC/marketplaces")
          test "$STATUS" = 201
          python3 -c 'import json; d=json.load(open("/tmp/marketplace.json"));assert d["currency"]=="USD" and d["connectionStatus"]=="UNCONFIGURED"'

          curl -fsS -b "$COOKIE" "$BASE/seller-marketplaces" > /tmp/marketplaces.json
          curl -fsS -b "$COOKIE" "$BASE/seller-accounts/audit" > /tmp/audit.json
          python3 -c 'import json; m=json.load(open("/tmp/marketplaces.json"));a=json.load(open("/tmp/audit.json"));assert len(m)==1 and len(a)==2,(m,a)'

          STATUS=$(curl -sS -b "$COOKIE" -o /dev/null -w '%{http_code}' \
            "$BASE/seller-marketplaces/33333333-3333-4333-8333-333333333333/orders")
          test "$STATUS" = 404
          echo "PostgreSQL V1-V4, login/CSRF, safe setup, replay and audit passed."
      - name: Print logs on failure
        if: failure()
        run: tail -200 /tmp/merchivra-pg.log || true
      - name: Remove the one-shot workflow after successful smoke
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pg-smoke-once.yml
          git commit -m 'test: finish one-shot PostgreSQL V1-V4 startup and local setup smoke'
          git push origin HEAD:main
