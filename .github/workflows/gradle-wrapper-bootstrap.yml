# One-time migration helper. Generates the official Gradle Wrapper using
# the trusted pinned Gradle distribution and commits it to main.
# Triggered only when this file is changed. Remove after bootstrap succeeds.
name: One-time verified Gradle wrapper generation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gradle-wrapper-bootstrap.yml

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Generate official Gradle wrapper and verify hashes
        run: |
          set -euo pipefail
          gradle -p apps/server --no-daemon wrapper \
            --gradle-version 9.2.1 --distribution-type bin \
            --gradle-distribution-sha256-sum 72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f
          echo '423cb469ccc0ecc31f0e4e1c309976198ccb734cdcbb7029d4bda0f18f57e8d9  apps/server/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          grep -F 'distributionSha256Sum=72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f' apps/server/gradle/wrapper/gradle-wrapper.properties
      - name: Commit wrapper scripts and official wrapper JAR
        run: |
          set -euo pipefail
          chmod +x apps/server/gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/gradlew apps/server/gradlew.bat apps/server/gradle/wrapper/gradle-wrapper.jar apps/server/gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo 'Wrapper already committed'
          else
            git commit -m 'build(gradle): commit official checksum-verified Gradle 9.2.1 wrapper'
            # Other app/docs commits can land while this workflow is building.
            # Replay only these generated wrapper files on the latest main.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
