server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;


    # Authorization codes arrive in the query string. Never log those URLs.
    # This is still a localhost-only Compose proxy; production reverse proxies
    # and ingress access logs must apply equivalent query redaction.
    location /api/v1/spapi/oauth/ {
        access_log off;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
