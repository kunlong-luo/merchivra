plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.merchivra'
version = '0.1.0-SNAPSHOT'
description = 'Merchivra ERP API - Java 25 / Spring Boot 4 / Gradle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    // Optional mirror for developers in regions with limited Maven Central access.
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    mavenCentral()
}

dependencies {
    // Generated official Amazon Selling Partner API SDK. No live calls by default.
    implementation 'software.amazon.spapi:spapi-sdk:1.13.0'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootJar') {
    archiveFileName = 'merchivra-server.jar'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.14'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.83
            }
        }
    }
}

// Make the intended >=83% coverage target available to contributors without
// breaking the existing development-stage test suite before its baseline
// reaches 83%. Run with -PstrictCoverage to enforce it in check/CI.
if (providers.gradleProperty('strictCoverage').isPresent()) {
    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }
}
