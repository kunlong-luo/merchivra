server:
  port: 8080

spring:
  application:
    name: merchivra-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:merchivra}
    username: ${DB_USER:merchivra}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# An explicit opt-in is required: unauthenticated M0 endpoints may only
# serve made-up demo fixtures. Never use this flag for production data.
merchivra:
  demo:
    enabled: ${MERCHIVRA_DEMO_ENABLED:false}

# Session cookie is HttpOnly + Strict. Enable secure=true behind HTTPS.
server:
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        same-site: strict
        secure: ${MERCHIVRA_SESSION_COOKIE_SECURE:false}

merchivra:
  bootstrap:
    username: ${MERCHIVRA_BOOTSTRAP_USERNAME:}
    password: ${MERCHIVRA_BOOTSTRAP_PASSWORD:}
    tenant-name: ${MERCHIVRA_BOOTSTRAP_TENANT_NAME:Merchivra Workspace}
