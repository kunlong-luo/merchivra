server:
  port: 8080
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        same-site: strict
        secure: ${MERCHIVRA_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: merchivra-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:merchivra}
    username: ${DB_USER:merchivra}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

merchivra:
  team:
    # Explicitly opt in to multi-owner invitations and reviewer permissions.
    enabled: ${MERCHIVRA_TEAM_ENABLED:false}
  demo:
    enabled: ${MERCHIVRA_DEMO_ENABLED:false}
  bootstrap:
    username: ${MERCHIVRA_BOOTSTRAP_USERNAME:}
    password: ${MERCHIVRA_BOOTSTRAP_PASSWORD:}
    tenant-name: ${MERCHIVRA_BOOTSTRAP_TENANT_NAME:Merchivra Workspace}

  spapi:
    # Real outbound requests remain disabled until approved per-seller OAuth/vault.
    enabled: ${MERCHIVRA_SPAPI_ENABLED:false}
    sandbox: ${MERCHIVRA_SPAPI_SANDBOX:true}
    allow-writes: ${MERCHIVRA_SPAPI_ALLOW_WRITES:false}
    orders-role-review:
      # Explicit two-person off-platform application-role verification.
      # Default OFF; reviewer RBAC is provisioned through trusted administration.
      enabled: ${MERCHIVRA_SPAPI_ORDERS_ROLE_REVIEW_ENABLED:false}
    verification:
      # Separate explicit live-only gate. No sandbox/Demo verification.
      enabled: ${MERCHIVRA_SPAPI_VERIFICATION_ENABLED:false}
    lwa-client-id: ${MERCHIVRA_LWA_CLIENT_ID:}
    lwa-client-secret: ${MERCHIVRA_LWA_CLIENT_SECRET:}
    oauth:
      # Requires reviewed public App registration and registered redirect URI.
      enabled: ${MERCHIVRA_SPAPI_OAUTH_ENABLED:false}
      application-id: ${MERCHIVRA_SPAPI_APP_ID:}
      redirect-uri: ${MERCHIVRA_SPAPI_OAUTH_REDIRECT_URI:}
      encryption-key-base64: ${MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEY_BASE64:}
      # Alternative to legacy key: comma-separated version:Base64Key entries.
      encryption-keyring: ${MERCHIVRA_SPAPI_OAUTH_ENCRYPTION_KEYRING:}
      active-key-version: ${MERCHIVRA_SPAPI_OAUTH_ACTIVE_KEY_VERSION:1}
      allowed-amazon-origins: ${MERCHIVRA_SPAPI_OAUTH_AMAZON_ORIGINS:}
      secure-cookie: ${MERCHIVRA_SPAPI_OAUTH_SECURE_COOKIE:true}

  operations:
    # Advisory-only: manual scans work without this scheduler.
    scheduler-enabled: ${MERCHIVRA_OPS_SCHEDULER_ENABLED:false}
    scan-interval-ms: ${MERCHIVRA_OPS_SCAN_INTERVAL_MS:900000}
    low-stock-threshold: ${MERCHIVRA_OPS_LOW_STOCK_THRESHOLD:3}

  orders-sync:
    # V11C explicit source selection: MOCK default, LIVE requires extra gates.
    mode: ${MERCHIVRA_ORDERS_SYNC_MODE:MOCK}
    live-approved: ${MERCHIVRA_ORDERS_SYNC_LIVE_APPROVED:false}
    # A LIVE source also requires app-role evidence for every Seller and
    # production-only read access. Never infer Orders role from Seller OAuth.

    enabled: ${MERCHIVRA_ORDERS_SYNC_ENABLED:false}
    scheduler-enabled: ${MERCHIVRA_ORDERS_SYNC_SCHEDULER_ENABLED:false}
    scheduler-ms: ${MERCHIVRA_ORDERS_SYNC_SCHEDULER_MS:30000}
