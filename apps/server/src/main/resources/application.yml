# Backend environment variables use concise domain names.
server:
  # Native test startup is loopback-only; Compose explicitly binds inside its network.
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Preserve the container/CI port; local IDEA may override to 8081.
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

springdoc:
  api-docs:
    enabled: ${CONTRACT_EXPORT_ENABLED:false}
  group-configs:
    - group: finance-profits
      paths-to-match:
        - /api/v1/finance/marketplaces/**/sku-profit-preview
        - /api/v1/finance/marketplaces/**/sku-profit-preview/**
        - /api/v1/finance/marketplaces/**/profit-reports
        - /api/v1/finance/marketplaces/**/profit-reports/**
    - group: fba-inbound
      paths-to-match:
        - /api/v1/fba/marketplaces/**/shipments
        - /api/v1/fba/marketplaces/**/shipments/**
    - group: ads-reports
      paths-to-match:
        - /api/v1/ads/marketplaces/**
    - group: operations-v67
      paths-to-match:
        - /api/v1/operations/findings
        - /api/v1/operations/findings/**
        - /api/v1/operations/summary
        - /api/v1/operations/scan
        - /api/v1/operations/marketplaces/**

spring:
  application:
    name: merchivra-server
  datasource:
    # Full JDBC URL is optional; keep split DB_* inputs for existing Compose/CI.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:merchivra}}
    username: ${DB_USER:merchivra}
    # Public test default; Docker supplies the required deployment password.
    password: ${DB_PASSWORD:merchivra}
  flyway:
    enabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # Public test default; deployment settings override explicitly.
      password: ${REDIS_PASSWORD:redis123456}
      timeout: 2s
      connect-timeout: 2s
    repositories:
      enabled: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

management:
  health:
    # Redis is optional in single-node mode. Enable this contributor only when
    # Redis-backed sessions or SP-API throttling is explicitly configured.
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

merchivra:
  evidence:
    # Never permit unscanned private original uploads outside synthetic Demo.
    # When required, startup fails if clamd host is absent; scan errors reject upload.
    av-required: ${EVIDENCE_AV_REQUIRED:false}
    av-host: ${EVIDENCE_AV_HOST:}
    av-port: ${EVIDENCE_AV_PORT:3310}
  external-issuer:
    offline-trust:
      # V209 technical PKIX/CRL checks only; never external legal identity.
      # These paths are deployed by the OPERATIONS team outside tenant APIs.
      # No AIA, CRLDP, OCSP, certificate network fetch, or CA enrollment route.
      # Strict default OFF and no access without root+chain+current signed CRL.
      enabled: ${EXTERNAL_ISSUER_OFFLINE_TRUST_ENABLED:false}
      root-cert-file: ${EXTERNAL_ISSUER_TRUST_ROOT_CERT_FILE:}
      issuer-chain-file: ${EXTERNAL_ISSUER_TRUST_CHAIN_FILE:}
      crl-file: ${EXTERNAL_ISSUER_TRUST_CRL_FILE:}
      operator-dns-allowlist: ${EXTERNAL_ISSUER_OPERATOR_DNS_ALLOWLIST:}
      carrier-dns-allowlist: ${EXTERNAL_ISSUER_CARRIER_DNS_ALLOWLIST:}
  redis:
    # Explicit opt-in: shared Session/CSRF only when Redis is configured.
    sessions-enabled: ${REDIS_SESSIONS_ENABLED:false}
  team:
    # Explicitly opt in to multi-owner invitations and reviewer permissions.
    enabled: ${TEAM_ENABLED:false}
  demo:
    enabled: ${DEMO_ENABLED:false}
  bootstrap:
    # Public disposable test login only; Compose explicitly overrides these values.
    username: ${BOOTSTRAP_USERNAME:admin}
    password: ${BOOTSTRAP_PASSWORD:MerchivraTest2026}
    tenant-name: ${BOOTSTRAP_TENANT_NAME:Merchivra}

  spapi:
    rate-limit:
      # Official SDK core typed reads: conservative family gate + operation
      # admission and adaptive header learning; other SDK calls: family gate.
      # Legacy HTTP reads: same operation-specific Redis budget. All callers
      # share an atomic Redis-time GCRA and 429 fence. No burst is assumed.
      # All replicas share Redis; Redis errors fail closed.
      enabled: ${SPAPI_RATE_LIMIT_ENABLED:false}
      cooldown-ms: ${SPAPI_RATE_LIMIT_COOLDOWN_MS:2000}
      # Default empty/one-token burst. Only configure manually approved
      # read operations (e.g. SEARCH_ORDERS=2); a learned rate header is
      # required before any configured burst takes effect.
      approved-bursts: ${SPAPI_APPROVED_BURSTS:}
    # Real outbound requests remain disabled until approved per-seller OAuth/vault.
    enabled: ${SPAPI_ENABLED:false}
    sandbox: ${SPAPI_SANDBOX:true}
    allow-writes: ${SPAPI_ALLOW_WRITES:false}
    reports:
      # Internal Amazon-generated settlement report discovery only. Requires
      # LIVE Seller+Finance role, Redis quota, approved egress and secret vault.
      # No schedule or public remote-import route. Default OFF.
      enabled: ${SPAPI_REPORTS_ENABLED:false}
      scheduler-enabled: ${SPAPI_REPORTS_SCHEDULER_ENABLED:false}
      scheduler-ms: ${SPAPI_REPORTS_SCHEDULER_MS:120000}
    orders-role-review:
      # Explicit two-person off-platform application-role verification.
      # Default OFF; reviewer RBAC is provisioned through trusted administration.
      enabled: ${SPAPI_ORDERS_ROLE_REVIEW_ENABLED:false}
    finances-role-review:
      # Independent dual-owner off-platform Amazon Finances app-role approval. OFF.
      enabled: ${SPAPI_FINANCES_ROLE_REVIEW_ENABLED:false}
    verification:
      # Separate explicit live-only gate. No sandbox/Demo verification.
      enabled: ${SPAPI_VERIFICATION_ENABLED:false}
    private:
      # Private Seller Central self-authorization: server-only one-shot import.
      enabled: ${SPAPI_PRIVATE_ENABLED:false}
    private-import:
      enabled: ${SPAPI_PRIVATE_IMPORT_ENABLED:false}
      tenant-id: ${SPAPI_PRIVATE_IMPORT_TENANT_ID:}
      account-id: ${SPAPI_PRIVATE_IMPORT_ACCOUNT_ID:}
      seller-id: ${SPAPI_PRIVATE_IMPORT_SELLER_ID:}
      refresh-token: ${SPAPI_PRIVATE_IMPORT_REFRESH_TOKEN:}
    lwa-client-id: ${LWA_CLIENT_ID:}
    lwa-client-secret: ${LWA_CLIENT_SECRET:}
    oauth:
      # Requires reviewed public App registration and registered redirect URI.
      enabled: ${SPAPI_OAUTH_ENABLED:false}
      application-id: ${SPAPI_APP_ID:}
      redirect-uri: ${SPAPI_OAUTH_REDIRECT_URI:}
      encryption-key-base64: ${SPAPI_OAUTH_ENCRYPTION_KEY_BASE64:}
      # Alternative to legacy key: comma-separated version:Base64Key entries.
      encryption-keyring: ${SPAPI_OAUTH_ENCRYPTION_KEYRING:}
      active-key-version: ${SPAPI_OAUTH_ACTIVE_KEY_VERSION:1}
      allowed-amazon-origins: ${SPAPI_OAUTH_AMAZON_ORIGINS:}
      secure-cookie: ${SPAPI_OAUTH_SECURE_COOKIE:true}

  operations:
    # Advisory-only: manual scans work without this scheduler.
    scheduler-enabled: ${OPS_SCHEDULER_ENABLED:false}
    scan-interval-ms: ${OPS_SCAN_INTERVAL_MS:900000}
    low-stock-threshold: ${OPS_LOW_STOCK_THRESHOLD:3}

  orders-sync:
    # V11C explicit source selection: MOCK default, LIVE requires extra gates.
    mode: ${ORDERS_SYNC_MODE:MOCK}
    live-approved: ${ORDERS_SYNC_LIVE_APPROVED:false}
    # A LIVE source also requires app-role evidence for every Seller and
    # production-only read access. Never infer Orders role from Seller OAuth.

    enabled: ${ORDERS_SYNC_ENABLED:false}
    scheduler-enabled: ${ORDERS_SYNC_SCHEDULER_ENABLED:false}
    scheduler-ms: ${ORDERS_SYNC_SCHEDULER_MS:30000}

  catalog-sync:
    # LIVE-only Inventory/Order Tracking reviewed role. No DEMO, no writes, no sandbox.
    enabled: ${CATALOG_SYNC_ENABLED:false}
    # Automatically progress only jobs started by a tenant Owner. OFF by default.
    scheduler-enabled: ${CATALOG_SYNC_SCHEDULER_ENABLED:false}
    scheduler-ms: ${CATALOG_SYNC_SCHEDULER_MS:10000}

  finance:
    profit-report:
      # Only progresses jobs explicitly created by a tenant Owner.
      # Default OFF: Owner may manually advance one bounded batch via API.
      # No Amazon, Ads or bank network access, no official ledger posting.
      scheduler-enabled: ${PROFIT_REPORT_SCHEDULER_ENABLED:false}
      scheduler-ms: ${PROFIT_REPORT_SCHEDULER_MS:15000}

  finances-sync:
    # Default OFF; verified Finance and Accounting role required per Seller.
    enabled: ${FINANCES_SYNC_ENABLED:false}
    # Optional: continue only Owner-started finance scans.
    scheduler-enabled: ${FINANCES_SYNC_SCHEDULER_ENABLED:false}
    scheduler-ms: ${FINANCES_SYNC_SCHEDULER_MS:60000}
