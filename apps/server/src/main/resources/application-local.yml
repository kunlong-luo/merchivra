# Native Pop!_OS / shared spark-db development only. Activate explicitly.
# Container and CI defaults remain in application.yml.
# Test password defaults are inherited from application.yml.
# Override with private configuration for any non-disposable data or credentials.
spring:
  config:
    import: "optional:file:${user.home}/.config/merchivra/application.yml"
  datasource:
    url: "${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:merchivra}}"
    username: ${DB_USER:merchivra}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
# Existing optional Redis switches, Amazon gates and evidence checks are
# inherited unchanged. Never enable shared Redis sessions by default.
